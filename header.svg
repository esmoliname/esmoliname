<svg fill="none" viewBox="0 0 850 200" width="100%" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="60%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#171129" />
    </linearGradient>
    <linearGradient id="cyanText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8" />
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" />
    </filter>
  </defs>

  <!-- Card Body -->
  <rect x="2" y="2" width="846" height="196" rx="14" fill="url(#cardBg)" />
  <rect x="2" y="2" width="846" height="196" rx="14" fill="none" stroke="url(#borderGlow)" stroke-width="1.5" />

  <!-- Window Header Bar -->
  <rect x="2" y="2" width="846" height="32" rx="14" fill="#161b22" fill-opacity="0.7" />
  <circle cx="24" cy="18" r="5" fill="#ef4444" />
  <circle cx="40" cy="18" r="5" fill="#f59e0b" />
  <circle cx="56" cy="18" r="5" fill="#10b981" />
  <text x="80" y="22" fill="#94a3b8" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" letter-spacing="1">AGENT_NODE // ESTEBAN_MOLINA.IDENTITY</text>
  <text x="820" y="22" text-anchor="end" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">CLEARANCE: L5</text>

  <!-- Left: Stylized Cyber Hologram Badge -->
  <g transform="translate(30, 48)">
    <rect width="105" height="125" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1.2" />
    <!-- Scanner line -->
    <line x1="8" y1="18" x2="97" y2="18" stroke="#00f2fe" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
    <!-- Abstract Avatar Wireframe -->
    <circle cx="52.5" cy="55" r="22" fill="#161b22" stroke="#00f2fe" stroke-width="1.5" />
    <path d="M26 102 C26 80, 79 80, 79 102" fill="#161b22" stroke="#a855f7" stroke-width="1.5" />
    <!-- Tag below photo -->
    <rect x="14" y="108" width="77" height="12" rx="3" fill="#0d1117" />
    <text x="52.5" y="117" text-anchor="middle" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">SYS_VERIFIED</text>
  </g>

  <!-- Right: Identity Data Fields -->
  <g transform="translate(160, 52)">
    <!-- Identity titles -->
    <text x="0" y="26" fill="url(#cyanText)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" letter-spacing="1">Esteban Molina Meza</text>
    <text x="0" y="48" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="13" letter-spacing="0.5">Full Stack Engineer &amp; AI Agent Architect</text>

    <!-- Console Specs Divider -->
    <line x1="0" y1="62" x2="650" y2="62" stroke="#1e293b" stroke-width="1" />

    <!-- Terminal Metadata Rows -->
    <text x="0" y="82" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">CORE_ENGINE :</text>
    <text x="105" y="82" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">TypeScript · Python · Multi-Agent Networks</text>

    <text x="0" y="103" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">RUNTIME_LOC :</text>
    <text x="105" y="103" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="11">San José / Puntarenas, Costa Rica (GMT-6)</text>

    <text x="0" y="124" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">OPERATION   :</text>
    <text x="105" y="124" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11">Active Deployment · Building Resilient AI</text>
  </g>
</svg>